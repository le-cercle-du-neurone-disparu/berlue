[pytest]
# -v: Verbose (show test names)
# -x: Fail fast (stop at first error)
# -s: Do not capture stdout (allow print statements)
# --color=yes: Force colored output
# --tb=short: Short traceback format for cleaner logs
# -W ignore::DeprecationWarning: Ignore verbose warnings from third-party libraries like pandas
addopts = -v -x -s --color=yes --tb=short -W ignore::DeprecationWarning
