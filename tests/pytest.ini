[pytest]
# -v: Verbeux (affiche les noms des tests)
# -x: Fail fast (s'arrête à la première erreur)
# -s: Ne capture pas stdout (autorise les print)
# --color=yes: Force la sortie colorée
# --tb=short: Format de traceback court pour des logs plus lisibles
# -W ignore::DeprecationWarning: Ignore les warnings verbeux des librairies tierces comme pandas
addopts = -v -x -s --color=yes --tb=short -W ignore::DeprecationWarning
